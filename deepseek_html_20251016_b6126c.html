<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хайповая кнопка донатов для Twitch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0e0e23 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .donate-button {
            width: 320px;
            height: 90px;
            background: linear-gradient(135deg, #9146FF 0%, #FF0099 50%, #00FFD1 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(145, 70, 255, 0.7);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            z-index: 1;
            transition: all 0.4s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: pulse-glow 2s infinite, color-shift 5s infinite;
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .donate-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(145, 70, 255, 0.9), 0 0 60px rgba(255, 0, 153, 0.5);
            animation: pulse-glow-fast 1s infinite, color-shift 3s infinite;
        }
        
        .donate-button:active {
            transform: scale(0.98);
        }
        
        .donate-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
            z-index: -1;
        }
        
        .donate-button:hover::before {
            left: 100%;
        }
        
        .twitch-icon {
            margin-right: 12px;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            animation: bounce 2s infinite;
        }
        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FF0099;
            border-radius: 50%;
            animation: float 6s infinite;
            opacity: 0;
        }
        
        .particle:nth-child(2) {
            background: #9146FF;
            animation-delay: 1s;
            top: 20%;
            left: 10%;
        }
        
        .particle:nth-child(3) {
            background: #00FFD1;
            animation-delay: 2s;
            top: 60%;
            left: 80%;
        }
        
        .particle:nth-child(4) {
            background: #FF9900;
            animation-delay: 3s;
            top: 80%;
            left: 20%;
        }
        
        .particle:nth-child(5) {
            background: #FF0099;
            animation-delay: 4s;
            top: 30%;
            left: 70%;
        }
        
        .click-me {
            color: white;
            font-size: 18px;
            text-align: center;
            margin-top: 10px;
            animation: blink 2s infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
        
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 25px rgba(145, 70, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 0, 153, 0.7), 0 0 50px rgba(0, 255, 209, 0.4);
            }
            100% {
                box-shadow: 0 0 25px rgba(145, 70, 255, 0.7);
            }
        }
        
        @keyframes pulse-glow-fast {
            0% {
                box-shadow: 0 0 25px rgba(145, 70, 255, 0.9);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 153, 0.9), 0 0 70px rgba(0, 255, 209, 0.6);
            }
            100% {
                box-shadow: 0 0 25px rgba(145, 70, 255, 0.9);
            }
        }
        
        @keyframes color-shift {
            0% {
                background: linear-gradient(135deg, #9146FF 0%, #FF0099 50%, #00FFD1 100%);
            }
            25% {
                background: linear-gradient(135deg, #FF0099 0%, #00FFD1 50%, #9146FF 100%);
            }
            50% {
                background: linear-gradient(135deg, #00FFD1 0%, #9146FF 50%, #FF0099 100%);
            }
            75% {
                background: linear-gradient(135deg, #9146FF 0%, #FF0099 50%, #00FFD1 100%);
            }
            100% {
                background: linear-gradient(135deg, #9146FF 0%, #FF0099 50%, #00FFD1 100%);
            }
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }
        
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .title {
            color: white;
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(145, 70, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Хайповая кнопка донатов</h1>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="donate-button" id="donateButton">
            <span class="twitch-icon">🎮</span>
            ПОДДЕРЖАТЬ СТРИМ
        </div>
        <div class="click-me">КЛИКАЙ ДЛЯ ДОНАТА!</div>
    </div>

    <script>
        const button = document.getElementById('donateButton');
        
        button.addEventListener('click', function() {
            // Анимация при клике
            this.style.animation = 'none';
            this.offsetHeight; // Триггер перерисовки
            this.style.animation = null;
            
            // Создаем эффект частиц при клике
            for (let i = 0; i < 10; i++) {
                createParticle();
            }
            
            // Имитация перехода на страницу доната
            setTimeout(() => {
                alert('Спасибо за донат! 🎉');
            }, 500);
        });
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Случайные цвета
            const colors = ['#9146FF', '#FF0099', '#00FFD1', '#FF9900', '#FFFFFF'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.background = color;
            
            // Случайная позиция вокруг кнопки
            const buttonRect = button.getBoundingClientRect();
            const x = buttonRect.left + Math.random() * buttonRect.width;
            const y = buttonRect.top + Math.random() * buttonRect.height;
            
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            // Случайная анимация
            const duration = 1 + Math.random() * 2;
            particle.style.animation = `float ${duration}s forwards`;
            
            document.body.appendChild(particle);
            
            // Удаляем частицу после анимации
            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
